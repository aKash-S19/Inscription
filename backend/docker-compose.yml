services:
  postgres:
    image: postgres:16
    container_name: kalvettu-postgres
    environment:
      POSTGRES_DB: kalvettu
      POSTGRES_USER: kalvettu
      POSTGRES_PASSWORD: kalvettu
    ports:
      - "5432:5432"
    volumes:
      - kalvettu-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalvettu -d kalvettu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kalvettu-pg:
