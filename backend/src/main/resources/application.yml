spring:
  application:
    name: kalvettu-backend
  profiles:
    active: dev
  # Load an optional ./backend/.env file so AI credentials can be pasted into
  # a local, git-ignored file instead of using environment variables.
  # 'optional:' means the app still starts if the file is absent.
  config:
    import: optional:file:./.env[.properties]
  jpa:
    hibernate:
      ddl-auto: none          # schema is provided by schema.sql (PostgreSQL-compatible)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8080

# ---- AI (Google Gemini) integration ----
# Set KALVETTU_AI_GEMINI_KEY with a valid key to enable the AI endpoints.
# Without a key the endpoints return 503 "AI not configured".
kalvettu:
  ai:
    enabled: true
    gemini-key: ${KALVETTU_AI_GEMINI_KEY:}
    gemini-model: ${KALVETTU_AI_GEMINI_MODEL:gemini-2.0-flash}
    system-prompt: >
      You are Kalvettu AI, an expert assistant for the Kalvettu digital archive of
      Tamil temple inscriptions. Answer only from the verified data provided in the
      context. If the answer is not in the provided context, say so honestly and do
      not invent facts, dates, names, translations or sources. Keep temple and
      inscription details accurate to the cited records.

---
# Default zero-install profile: H2 running in PostgreSQL compatibility mode.
# This lets the whole application (real PostgreSQL DDL, real queries) run with
# no external database installed. For a genuine PostgreSQL server, use the
# 'postgres' profile (see application-postgres.yml) and docker-compose.yml.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:kalvettu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${KALVETTU_DB_URL:jdbc:postgresql://localhost:5432/kalvettu}
    driver-class-name: org.postgresql.Driver
    username: ${KALVETTU_DB_USER:kalvettu}
    password: ${KALVETTU_DB_PASSWORD:kalvettu}
